services:
  - type: web
    name: macropulse-public-demo
    runtime: python
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: pip install -r backend/requirements-public-research.txt
    startCommand: python -m uvicorn backend.public_demo:create_public_app --factory --host 0.0.0.0 --port ${PORT} --workers 1 --no-proxy-headers --no-access-log
    envVars:
      - key: MARKETPULSE_MODE
        value: public_demo
      - key: MARKETPULSE_DEMO_ANALYSIS_ENABLED
        value: 'false'
      - key: MARKETPULSE_DEMO_RESEARCH_ENABLED
        value: 'false'
      - key: MARKETPULSE_DEMO_GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MARKETPULSE_DEMO_PROJECT_REF
        value: swpithkjviavycrxpwed
      - key: MARKETPULSE_DEMO_ALLOW_SHARED_PROJECT
        value: 'true'
      - key: MARKETPULSE_DEMO_DSN
        sync: false
      - key: MARKETPULSE_DEMO_SSL_ROOT_CERT
        value: /etc/secrets/macropulse-demo-ca.pem
      - key: MARKETPULSE_DEMO_ORIGIN_SECRET
        sync: false
