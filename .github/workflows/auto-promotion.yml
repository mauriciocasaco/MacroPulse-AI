name: Staging Promotion PR

# Only code already merged into the protected dev branch may request a promotion.
# This workflow deliberately opens a PR; it never merges or deploys anything.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: macropulse-staging-promotion
  cancel-in-progress: false

jobs:
  open-staging-pr:
    name: Open staging promotion PR
    if: github.repository == 'mauriciocasaco/MacroPulse-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect staging promotion state
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/staging...dev" --jq '.ahead_by')"
          if [[ ! "$ahead" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine dev's commits ahead of staging."
            exit 1
          fi

          if (( ahead == 0 )); then
            echo "::notice::Nothing new in dev to propose for staging."
            exit 0
          fi

          existing="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=staging&per_page=100" \
            --jq '[.[] | select(.head.ref == "dev" and .head.repo.full_name == "mauriciocasaco/MacroPulse-AI")] | .[0].number // empty')"

          if [[ -n "$existing" ]]; then
            echo "::notice::Promotion PR #$existing already exists and tracks dev."
            exit 0
          fi

          echo "create_pr=true" >> "$GITHUB_OUTPUT"

      - name: Create a repository-scoped GitHub App token
        if: steps.inspect.outputs.create_pr == 'true'
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MACROPULSE_PROMOTION_CLIENT_ID }}
          private-key: ${{ secrets.MACROPULSE_PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Open dev to staging PR
        if: steps.inspect.outputs.create_pr == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail

          body="$(cat <<'EOF'
          ## Automated promotion: dev -> staging

          This PR was opened by the MacroPulse promotion bot after a change
          landed on the protected `dev` branch.

          - Source: `dev` (tracks its current tip until the PR is merged)
          - Destination: `staging`
          - Required checks: CI, CodeQL, Gitleaks, Promotion Policy
          - **No automatic merge in this rollout.**
          - **No Render/Cloudflare deployment.**

          Do not merge until the staging-specific evaluation gates are available.
          EOF
          )"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f head=dev \
            -f base=staging \
            -f title="chore(release): promote dev to staging" \
            -f body="$body" \
            -F draft=false \
            --jq '.html_url'
